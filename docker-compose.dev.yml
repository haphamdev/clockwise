# Dev overrides — always run with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      API_URL: http://backend:3000

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - '3000:3000'
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/logs:/app/logs
    environment:
      NODE_ENV: development

  db:
    ports:
      - '5432:5432'
