info:
  name: list-tasks
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/v1/projects/{{projectId}}/tasks
  auth: bearer
  params:
    - name: q
      value: "test"
      enabled: true
    - name: page
      value: "1"
      enabled: true
    - name: limit
      value: "10"
      enabled: true

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.total
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
