info:
  name: get-team-breakdown
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/api/v1/dashboard/team-breakdown
  auth: bearer

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.teams
      operator: isDefined

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
