info:
  name: list-user-projects
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/api/v1/users/{{userId}}/projects
  auth: bearer
  params:
    - name: page
      value: "1"
      enabled: true
    - name: limit
      value: "5"
      enabled: true
    - name: includeArchived
      value: "true"
      enabled: false

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.total
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
