info:
  name: heath-check
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/v1/health
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.status
      operator: eq
      value: ok
    - expression: res.body.timestamp
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
