info:
  name: get-time-series
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/v1/reports/time-series
  auth: bearer
  params:
    - name: dateFrom
      value: "2026-03-01"
      enabled: true
    - name: dateTo
      value: "2026-04-04"
      enabled: true
    - name: granularity
      value: "week"
      enabled: true
    - name: groupBy
      value: "project"
      enabled: true
    - name: stackBy
      value: "user"
      enabled: false
    - name: teamIds
      value: "{{teamId}}"
      enabled: false
    - name: userIds
      value: "{{userId}}"
      enabled: false
    - name: projectIds
      value: "{{projectId}}"
      enabled: false

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.buckets
      operator: isArray
    - expression: res.body.summary.totalHours
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
