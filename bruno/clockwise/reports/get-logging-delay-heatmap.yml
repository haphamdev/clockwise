info:
  name: get-logging-delay-heatmap
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:3000/api/v1/reports/logging-delay-heatmap
  auth: bearer
  params:
    - name: dateFrom
      value: "2026-03-01"
      enabled: true
    - name: dateTo
      value: "2026-04-04"
      enabled: true
    - name: teamIds
      value: "{{teamId}}"
      enabled: false
    - name: userIds
      value: "{{userId}}"
      enabled: false
    - name: projectIds
      value: "{{projectId}}"
      enabled: false

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.cells
      operator: isArray
    - expression: res.body.minEntries
      operator: eq
      value: "5"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
