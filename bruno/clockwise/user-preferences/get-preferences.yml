info:
  name: get-preferences
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/v1/users/me/preferences
  auth: bearer

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.theme
      operator: isString
    - expression: res.body.timezone
      operator: isString
    - expression: res.body.weekStartDay
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
