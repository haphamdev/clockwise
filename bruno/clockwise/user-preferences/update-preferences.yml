info:
  name: update-preferences
  type: http
  seq: 2

http:
  method: PATCH
  url: http://localhost:3000/api/v1/users/me/preferences
  auth: bearer
  body:
    contentType: json
    body: |
      {
        "theme": "dark",
        "timezone": "America/New_York",
        "weekStartDay": "monday"
      }

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.theme
      operator: eq
      value: dark
    - expression: res.body.timezone
      operator: eq
      value: America/New_York

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
