info:
  name: unarchive-time-log
  type: http
  seq: 6

http:
  method: PATCH
  url: http://localhost:3000/api/v1/time-logs/{{timeLogId}}/unarchive
  auth: bearer
  body:
    type: json
    json: |
      {
        "reason": "Restored entry"
      }

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.message
      operator: eq
      value: "Time log unarchived"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
