info:
  name: list-time-logs
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:3000/api/v1/time-logs
  auth: bearer
  params:
    - name: page
      value: "1"
      enabled: true
    - name: limit
      value: "20"
      enabled: true
    - name: dateFrom
      value: "2026-03-01"
      enabled: false
    - name: dateTo
      value: "2026-04-02"
      enabled: false
    - name: projectId
      value: "{{projectId}}"
      enabled: false
    - name: userId
      value: "{{userId}}"
      enabled: false
    - name: teamId
      value: "{{teamId}}"
      enabled: false

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.total
      operator: isNumber
    - expression: res.body.totalHours
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
