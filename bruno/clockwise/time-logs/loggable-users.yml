info:
  name: loggable-users
  type: http
  seq: 7

http:
  method: GET
  url: http://localhost:3000/api/v1/time-logs/loggable-users
  auth: bearer

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
