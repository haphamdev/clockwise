info:
  name: get-time-log
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:3000/api/v1/time-logs/{{timeLogId}}
  auth: bearer

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.id
      operator: isString

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
