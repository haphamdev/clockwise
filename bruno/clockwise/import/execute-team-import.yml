info:
  name: execute-team-import
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:3000/api/v1/import/execute
  auth: bearer
  body:
    type: json
    json: |
      {
        "type": "team",
        "previewToken": "{{previewToken}}"
      }

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"
    - expression: res.body.jobId
      operator: isString
    - expression: res.body.totalRows
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
