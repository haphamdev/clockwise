info:
  name: list-import-jobs
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:3000/api/v1/import/jobs?page=1&limit=20&type=time-log
  auth: bearer

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.data
      operator: isArray
    - expression: res.body.total
      operator: isNumber
    - expression: res.body.page
      operator: isNumber
    - expression: res.body.limit
      operator: isNumber

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
