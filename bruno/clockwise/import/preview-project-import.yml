info:
  name: preview-project-import
  type: http
  seq: 7

http:
  method: POST
  url: http://localhost:3000/api/v1/import/preview
  auth: bearer
  body:
    type: json
    json: |
      {
        "type": "project",
        "csvContent": "name,description,status,teams,daily_hour_limit,weekly_hour_limit\nMy Project,A sample project,active,Engineering,8,40"
      }

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.totalRows
      operator: isNumber
    - expression: res.body.validRows
      operator: isArray

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
