info:
  name: download-template
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:3000/api/v1/import/template/time-log
  auth: bearer

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers['content-type']
      operator: contains
      value: "text/csv"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
