info:
  name: get-project-settings
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:3000/api/v1/projects/{{projectId}}/settings
  auth: bearer

auth:
  bearer:
    token: "{{accessToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
