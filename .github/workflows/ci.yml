name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PNPM_VERSION: "9.15"
  NODE_VERSION: "20"

jobs:
  backend:
    name: Backend — Lint, Test, Build
    runs-on: ubuntu-latest
    # Testcontainers spins up a PostgreSQL container automatically via Docker.
    # ubuntu-latest includes Docker pre-installed, so no extra setup is needed.
    env:
      JWT_SECRET: ci-test-jwt-secret
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret
      DATABASE_URL: "postgresql://test:test@localhost:5432/test" # Overridden by Testcontainers at runtime
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm lint
        working-directory: backend
      - run: pnpm test
        working-directory: backend
      - run: pnpm build
        working-directory: backend

  frontend-unit:
    name: Frontend — Lint, Jest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm lint
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm build
        working-directory: frontend

  frontend-e2e:
    name: Frontend — Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend, frontend-unit]
    env:
      JWT_SECRET: ci-test-jwt-secret
      JWT_REFRESH_SECRET: ci-test-jwt-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: backend
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Start backend
        run: |
          pnpm start:dev &
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1 > /dev/null 2>&1 && break
            sleep 2
          done
        working-directory: backend
        env:
          DATABASE_URL: "postgresql://test:test@localhost:5432/test"
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
